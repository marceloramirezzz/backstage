<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0c0c0e}
a{color:var(--spotlight-ink)}a:hover{color:var(--ink)}
a.bs-chip,a.bs-btn,.bs-nav a{text-decoration:none}
.app-side{display:block}
@media (max-width: 900px){.app{grid-template-columns:minmax(0,1fr) !important}.app-side{display:none}.cols{grid-template-columns:minmax(0,1fr) !important}}

</style>
<div class="bs-root" data-theme="dark" style="min-height: 100vh; background: var(--bg-0); color: var(--ink); font-family: var(--font-sans); display: grid; place-items: center; padding: 24px; box-sizing: border-box">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<img src="../design-system/logos/backstage-door-spotlight.png" alt="Backstage" style="height: 64px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Sign in to Backstage</h1>
<p style="margin: 0; font-size: 14px; color: var(--ink-muted)">Your band’s gigs, setlists and payouts in one place.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: var(--radius-lg); background: var(--bg-1); border: 1px solid var(--line)">
<button class="bs-btn bs-btn-secondary" style="justify-content: center; height: 44px"><svg class="bs-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8v2.3h3A9 9 0 0 0 21 12.2z"/><path d="M12 21a8.9 8.9 0 0 0 6.1-2.2l-3-2.3a5.6 5.6 0 0 1-8.3-2.9H3.7v2.4A9 9 0 0 0 12 21z"/><path d="M6.8 13.6a5.4 5.4 0 0 1 0-3.4V7.8H3.7a9 9 0 0 0 0 8.2z"/><path d="M12 6.4c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9 9 0 0 0 3.7 7.8l3.1 2.4A5.4 5.4 0 0 1 12 6.4z"/></svg>Continue with Google</button>
<div style="display: flex; align-items: center; gap: 12px; color: var(--ink-subtle); font-size: 12px"><span style="flex-grow: 1; height: 1px; background: var(--line)"></span>or<span style="flex-grow: 1; height: 1px; background: var(--line)"></span></div>
<label class="bs-field"><span class="bs-label">Email</span><input class="bs-input" type="email" placeholder="you@example.com" style="height: 44px"></label>
<label class="bs-field"><span class="bs-label" style="display: flex; justify-content: space-between">Password<a href="#" style="font-weight: 400">Forgot?</a></span><input class="bs-input" type="password" value="password" style="height: 44px"></label>
<a class="bs-btn bs-btn-primary" href="welcome.html" style="justify-content: center; height: 44px">Sign in</a>
</div>
<p style="margin: 0; text-align: center; font-size: 14px; color: var(--ink-muted)">New here? <a href="#">Create an account</a></p>
</div>
</div>
</body>
</html>
