name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: backstage
          POSTGRES_PASSWORD: backstage
          POSTGRES_DB: backstage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backstage"
          --health-interval 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://backstage:backstage@localhost:5432/backstage

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR and delete old versions (only used on main)
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Build once and load it into the runner's Docker so we can test it.
      # The GitHub Actions cache makes the later push step reuse these layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: backstage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image works on its own: migrate an empty database from the
      # image, start the server, and require /api/healthz to answer 200.
      - name: Smoke test image
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=backstage -e POSTGRES_PASSWORD=backstage -e POSTGRES_DB=backstage \
            --health-cmd "pg_isready -U backstage" --health-interval 2s postgres:17
          # shellcheck disable=SC2016 # the inner bash expands it, on each retry
          timeout 60 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" db)" = healthy ]; do sleep 1; done'
          URL=postgres://backstage:backstage@db:5432/backstage
          docker run --rm --network ci -e DATABASE_URL=$URL backstage:ci node scripts/migrate.ts
          docker run -d --name app --network ci -p 3000:3000 -e DATABASE_URL=$URL backstage:ci
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 localhost:3000/api/healthz

      - name: Show app logs on failure
        if: failure()
        run: docker logs app || true

      # Everything below runs only for pushes to main, never for PRs.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # One manifest per image, so each push is exactly one package
          # version and the cleanup below counts images, not attestations.
          provenance: false
          sbom: false

      # Free private GHCR storage is 500 MB (ADR 0003): keep the newest 3.
      - if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
